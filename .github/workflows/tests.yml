name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No pip install step - Yantra and its test suite use only the
      # Python standard library (unittest), by design. This CI run
      # doesn't need Claude CLI or Headroom installed: it covers the pure
      # Python logic (config loading, launch-command building, hook
      # merge/idempotency) and the real safety_gates.js hook via node -
      # not full end-to-end `yantra` launches, which need live credentials.
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
